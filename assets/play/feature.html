<!doctype html>
<!-- Ảnh bìa Google Play 1024×500. Xuất: google-chrome --headless=new --hide-scrollbars --window-size=1024,500 --screenshot=feature.png file://$PWD/feature.html -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts.css">
<style>
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; display: flex; align-items: center; gap: 56px; padding: 0 72px; box-sizing: border-box;
         font-family: 'Be Vietnam Pro', 'Noto Sans CJK SC', sans-serif; color: #fff;
         background: radial-gradient(700px 420px at 0% 0%, #e8392f 0%, transparent 70%), #a3101a; }
  img { width: 208px; height: 208px; flex: none; filter: drop-shadow(0 14px 28px rgba(60, 0, 8, .4)); }
  h1 { margin: 0; font-size: 56px; line-height: 1.12; font-weight: 800; letter-spacing: -.02em; }
  .demo { display: flex; gap: 36px; margin-top: 30px; font-size: 27px; font-weight: 500; white-space: nowrap; }
  .demo b { font-weight: 800; color: #ffd54a; }
  .demo span { opacity: .75; }
</style></head>
<body>
  <img src="../logo.svg" alt="">
  <div>
    <h1>Vietnamese and Chinese on one keyboard</h1>
    <div class="demo"><div><span>treen →</span> <b>trên</b></div><div><span>nihao →</span> <b>你好</b></div></div>
  </div>
</body></html>
