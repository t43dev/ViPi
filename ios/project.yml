# ViPi cho iPhone và iPad: app chứa (cài đặt, hướng dẫn bật) + bàn phím (keyboard extension).
# Lõi Rust: scripts/ios-core.sh tạo Core/ViPiCore.xcframework và Core/ViPiCoreFFI.swift (không lưu trong git).
# Tạo dự án Xcode: xcodegen generate (scripts/ios-build.sh làm cả hai bước). Info.plist và entitlements do XcodeGen sinh.
name: ViPi
options:
  bundleIdPrefix: dev.t43
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ViPi:
    type: application
    platform: iOS
    sources:
      - path: ViPi
      - path: Shared
      - path: Core/ViPiCoreFFI.swift
    dependencies:
      - framework: Core/ViPiCore.xcframework
        embed: false
      - target: ViPiKeyboard
        embed: true
        codeSign: true
    info:
      path: ViPi/Info.plist
      properties:
        CFBundleDisplayName: ViPi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ViPi/ViPi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.t43.vipi
    scheme:
      testTargets: [ViPiUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.t43.vipi
        PRODUCT_NAME: ViPi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # bản phát hành: ký thủ công bằng chứng chỉ Apple Distribution của team (scripts/ios-testflight.sh truyền DEVELOPMENT_TEAM)
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ViPi AppStore

  ViPiKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ViPiKeyboard
      - path: Shared
      - path: Core/ViPiCoreFFI.swift
      # dữ liệu bộ gõ nằm trong bundle của bàn phím, lõi đọc thẳng bằng mmap (không tính vào giới hạn bộ nhớ)
      - path: ../Resources/vietnamese-syllables.txt
        buildPhase: resources
      - path: ../Resources/pinyin-words.bin
        buildPhase: resources
      - path: ../Resources/pinyin-abbrev.bin
        buildPhase: resources
      - path: ../Resources/bigram.bin
        buildPhase: resources
      - path: ../Resources/s2t.bin
        buildPhase: resources
      - path: ../Resources/autoswitch-vi.bin
        buildPhase: resources
      - path: ../Resources/autoswitch-en.bin
        buildPhase: resources
      - path: ../Resources/autoswitch-pairs.bin
        buildPhase: resources
      # mô hình gợi ý từ (scripts/ios-suggest-models.sh tải về ios/Suggest/, không lưu trong git); cũng đọc bằng mmap
      - path: ../Resources/keep-words.txt
        buildPhase: resources
      - path: ../Resources/keep-words-chat.txt
        buildPhase: resources
      - path: Suggest/SuggestEN.bin
        buildPhase: resources
      - path: Suggest/SuggestNN.bin
        buildPhase: resources
      - path: Suggest/SuggestVI.bin
        buildPhase: resources
      - path: Suggest/SuggestVINN.bin
        buildPhase: resources
    dependencies:
      - framework: Core/ViPiCore.xcframework
        embed: false
    info:
      path: ViPiKeyboard/Info.plist
      properties:
        CFBundleDisplayName: ViPi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: vi-VN
            # Full Access chỉ để rung; bàn phím gõ đầy đủ khi không bật
            RequestsOpenAccess: true
    entitlements:
      path: ViPiKeyboard/ViPiKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.t43.vipi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.t43.vipi.keyboard
        PRODUCT_NAME: ViPiKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
      # bản phát hành: ký thủ công bằng chứng chỉ Apple Distribution của team (scripts/ios-testflight.sh truyền DEVELOPMENT_TEAM)
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ViPi Keyboard AppStore

  # gõ thử bàn phím trên simulator (chạm theo toạ độ), xem ViPiUITests/TypingTests.swift
  ViPiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ViPiUITests
    dependencies:
      - target: ViPi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.t43.vipi.uitests
        GENERATE_INFOPLIST_FILE: YES
